<!doctype html>
<html>
<head>
<title>Create a new user</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.0/css/bootstrap.min.css" integrity="sha384-SI27wrMjH3ZZ89r4o+fGIJtnzkAnFs3E4qz9DIYioCQ5l9Rd/7UAa8DHcaL8jkWt" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.0/js/bootstrap.min.js" integrity="sha384-3qaqj0lc6sV/qpzrc1N5DC6i1VRn/HyX4qdPaiEFbn54VjQBEU341pvjz7Dv3n6P" crossorigin="anonymous"></script>
<style>
div {
	padding-top: 10px;
}

</style>
</head>

<body>
<form action="" method="get" autocomplete="off" style="padding-top: 20px;">
<div class="container">
<input type="text" style="display:none">
<input type="password" style="display:none">

  <div class="row justify-content-center">
    <h3>Create a new user</h3>
  </div>
  <div class="row justify-content-center">
	<label for="first_name" class="col-2">First name (required):</label>
    <input type="text" class="col-3" id="first_name" name="user_first_name" required>

    <label for="last_name" class="col-2">Last name (required):</label>
    <input type="text" class="col-3" id="last_name" name="user_last_name">	
  </div>

  <div class="row justify-content-center">
    <label for="username" class="col-2">Username (required):</label>
    <input type="text" class="col-3" id="username" name="user_username" required>
	
    <label for="description" class="col-2">Description:</label>
    <input type="text" id="description" class="col-3" name="user_description">
  </div>
  
  <div class="row justify-content-center">
    <label for="address" class="col-2">Address:</label>
    <input type="text" class="col-3" id="address" name="user_address" required>
	
	<label for="address2" class="col-2">Address 2 (max 5 characters):</label>
    <input type="text" id="address2" pattern=".{0,5}" class="col-3" title="Address 2 should have at most 5 characters" name="user_address2">

  </div>
  
  <div class="row justify-content-center">
	<label for="age" class="col-2">Age (between 18 and 65):</label>
    <input type="number" id="age" min="18" class="col-3" name="user_age">

    <label for="user_password" class="col-2">Password (required, at least 4 characters):</label>
    <input type="password" class="col-3" pattern=".{5,}" id="user_password" name="user_password" title="Password should have at least 4 characters" min="5" required>
  </div>

  <div class="row">
    <button class="col-2 offset-9" type="submit">Create user</button>
  </div>
</div>
</form>

</body>

</html>
